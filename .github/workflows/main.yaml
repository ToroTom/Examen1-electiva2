name: Deploy a surge.sh

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar surge
        run: npm install --global surge

      - name: Desplegar a surge.sh
        run: surge ./ examen1-electiva2-torotom.surge.sh --token ${{ secrets.SURGE_TOKEN }}
